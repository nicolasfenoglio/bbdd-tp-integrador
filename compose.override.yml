services:
  backend:
    build:
      target: development
    command: npm run dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
